[project]
name = "justonce"
version = "0.2.0"
description = "Make side effects happen exactly once. Idempotency keys, atomic claims, and an effect ledger for code that charges money, sends messages, or mutates state."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sharma", email = "abhicse24@gmail.com" }]
keywords = [
    "idempotency", "exactly-once", "deduplication", "retry", "reconciliation",
    "payments", "distributed-systems", "reliability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
justonce = "justonce.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
django = ["django>=4.2"]
otel = ["opentelemetry-api>=1.20"]
flask = ["flask>=2.2"]
sqlalchemy = ["sqlalchemy>=2.0"]
celery = ["celery>=5.3"]
examples = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "django>=4.2",
    "fastapi>=0.115",
    "flask>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "celery>=5.3",
    # The SDK, not just the API: the tracing tests assert against real spans,
    # because OpenTelemetry's own rules (attribute types, a span ended twice,
    # a start after an end) are what a mock would happily accept.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/abhisheksharma2411/justonce"
Issues = "https://github.com/abhisheksharma2411/justonce/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justonce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[[tool.mypy.overrides]]
module = ["django.*", "celery.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/justonce"]
