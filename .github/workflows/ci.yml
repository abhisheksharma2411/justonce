name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04 now, and actions/python-versions has no 3.9
    # build for it -- 3.9 went EOL before 26.04 shipped, so the newest 3.9.25
    # artifacts stop at 24.04. The wheel still declares requires-python >= 3.9,
    # so the job is pinned rather than dropped: dropping it would leave that
    # claim untested instead of making it false.
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - python: "3.9"
            os: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: justonce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Lint
        run: ruff check src tests

      - name: Test (SQLite + Postgres conformance)
        env:
          JUSTONCE_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/justonce_test
        run: pytest -q --cov=justonce --cov-report=term-missing

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: mypy
